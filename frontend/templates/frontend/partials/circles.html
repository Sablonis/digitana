<div class="divide-y divide-gray-50">
    {% for circle in circles %}
    <div class="px-6 py-4 hover:bg-gray-50 transition-colors">
        <div class="flex items-center justify-between">
            <div>
                <p class="font-medium text-gray-800">{{ circle.name }}</p>
                <p class="text-sm text-gray-500">{{ circle.description }}</p>
            </div>
            <span class="px-2 py-1 text-xs font-semibold text-green-700 bg-green-100 rounded-full">{{ circle.status
                }}</span>
        </div>
    </div>
    {% empty %}
    <div class="p-6 text-center text-gray-400">No circles found.</div>
    {% endfor %}
</div>
